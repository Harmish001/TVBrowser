name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install JS dependencies
        run: npm ci

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TVBrowser.apk

      - name: Show APK facts (SDK level, ABIs, features)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging TVBrowser.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|uses-feature|uses-implied-feature|uses-permission)" || true
          echo "ABIs inside APK:"
          unzip -l TVBrowser.apk | grep " lib/" | awk '{print $4}' | cut -d/ -f2 | sort -u || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBrowser-apk
          path: TVBrowser.apk
          if-no-files-found: error

      - name: Publish GitHub Release (direct APK link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TVBrowser build ${{ github.run_number }}
          files: TVBrowser.apk
